server:
  port: ${PORT:8080}

spring:
  profiles:
    default: local

  jpa:
    open-in-view: false

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5000,http://localhost:8081,http://localhost:5173"

  lostark:
    base-url: https://developer-lostark.game.onstove.com
    api-token: ${LOSTARK_API_TOKEN:}

  riot:
    dev-api-key: ${RIOT_DEV_API_KEY:}
    lol-api-key: ${RIOT_LOL_API_KEY:}
    tft-api-key: ${RIOT_TFT_API_KEY:}

  eternal-return:
    base-url: https://open-api.bser.io
    production-api-key: ${ER_PRODUCTION_API_KEY:}
  
  maplestory:
    base-url: https://open.api.nexon.com
    api-key: ${NEXON_API_KEY:}

  neople:
    base-url: https://api.neople.co.kr
    api-key: ${NEOPLE_API_KEY:}
  
  pubg:
    base-url: https://api.pubg.com
    api-key: ${PUBG_API_KEY:}
  
  henrik:
    api:
      key: ${HENRIK_API_KEY:}
      base-url: https://api.henrikdev.xyz

  game-finder:
    steam-api-key: ${STEAM_WEB_API_KEY:}
    igdb-client-id: ${IGDB_CLIENT_ID:}
    igdb-client-secret: ${IGDB_CLIENT_SECRET:}
    sync-enabled: ${GAME_FINDER_CATALOG_SYNC_ENABLED:false}
    sync-cron: "${GAME_FINDER_CATALOG_SYNC_CRON:0 0 */6 * * *}"
    sync-batch-size: ${GAME_FINDER_SYNC_BATCH_SIZE:40}
    catalog-page-size: ${GAME_FINDER_CATALOG_PAGE_SIZE:5000}
    catalog-pages-per-run: ${GAME_FINDER_CATALOG_PAGES_PER_RUN:4}
    steam-store-request-delay-ms: ${GAME_FINDER_STEAM_STORE_REQUEST_DELAY_MS:500}
    steam-store-connect-timeout-ms: ${GAME_FINDER_STEAM_STORE_CONNECT_TIMEOUT_MS:5000}
    steam-store-read-timeout-ms: ${GAME_FINDER_STEAM_STORE_READ_TIMEOUT_MS:10000}
    igdb-request-interval-ms: ${GAME_FINDER_IGDB_REQUEST_INTERVAL_MS:260}
    bootstrap-max-apps: ${GAME_FINDER_BOOTSTRAP_MAX_APPS:0}
    bootstrap-on-start: ${GAME_FINDER_BOOTSTRAP_ON_START:false}
    command: ${GAME_FINDER_COMMAND:}
    smoke-app-ids: ${GAME_FINDER_SMOKE_APP_IDS:570,1245620,4436560}
